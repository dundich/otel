name: ${COMPOSE_PROJECT_NAME:-otel-demo}

services:
  aspire-dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
      args:
        VERSION: ${DASHBOARD_VERSION:-}
    image: ${ASPIRE_DASHBOARD_IMAGE:-ra-monitor-dashboard:17.0.0}
    environment:
      # Step 1 demo: no login token. Only bind to 127.0.0.1 and never expose publicly.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
      Dashboard__Branding__Title: "${DASHBOARD_APP_NAME:-РА-Монитор}"
      Dashboard__Branding__LogoUrl: "${DASHBOARD_LOGO_URL:-/img/logo-ra.svg}"
      # Hide the dashboard's "endpoint is unsecured" warning. The endpoint is still
      # unsecured on purpose in this demo; this only removes the banner.
      Dashboard__Otlp__SuppressUnsecuredMessage: "${DASHBOARD_SUPPRESS_UNSECURED:-true}"
      ASPNETCORE_URLS: http://0.0.0.0:18888
      ASPIRE_DASHBOARD_OTLP_ENDPOINT_URL: http://0.0.0.0:18889
      # Host-specific base URL. Different deployments can mount the same
      # dashboard under their own path, e.g. DASHBOARD_BASE_PATH=/monitor.
      Dashboard__BasePath: ${DASHBOARD_BASE_PATH:-/}
      Dashboard__Frontend__PublicUrl: ${DASHBOARD_PUBLIC_URL:-http://localhost:${DASHBOARD_PORT:-18888}}
      Dashboard__Files__Title: "${DASHBOARD_FILES_TITLE:-Файлы}"
      Dashboard__Files__Roots__logs__Title: "${DASHBOARD_LOGS_TITLE:-Логи}"
      Dashboard__Files__Roots__logs__Path: ${DASHBOARD_LOGS_PATH:-/workspace/logs}
      Dashboard__Files__Roots__logs__Url: ${DASHBOARD_LOGS_URL:-/files/logs}
      Dashboard__Files__Roots__share__Title: "${DASHBOARD_SHARE_TITLE:-Share}"
      Dashboard__Files__Roots__share__Path: ${DASHBOARD_SHARE_PATH:-/host-home}
      Dashboard__Files__Roots__share__Url: ${DASHBOARD_SHARE_URL:-/files/share}
    volumes:
      - ./:/workspace:ro
      - ${HOME}:/host-home:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${DASHBOARD_PORT:-18888}:18888"   # dashboard UI
      - "${BIND_ADDR:-127.0.0.1}:${OTLP_PORT:-4317}:18889"         # OTLP/gRPC
    restart: unless-stopped

  app1:
    build:
      context: .
      dockerfile: src/App1.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      DOTNET_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: app1
      OTEL_METRIC_EXPORT_INTERVAL: "2000"
      OTEL_BSP_SCHEDULE_DELAY: "1000"
      Dashboard__RegistryUrl: ${DASHBOARD_REGISTRY_URL:-http://aspire-dashboard:18888/api/registry}
      Service__Name: app1
      Service__InternalUrl: http://app1:8080
      Service__PublicUrl: http://localhost:${APP1_PORT:-8081}
      Logging__LogLevel__Default: Information
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${APP1_PORT:-8081}:8080"
    depends_on:
      - aspire-dashboard
    restart: unless-stopped

  app2:
    build:
      context: .
      dockerfile: src/App2.Counter/Dockerfile
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      DOTNET_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: app2
      OTEL_METRIC_EXPORT_INTERVAL: "2000"
      OTEL_BSP_SCHEDULE_DELAY: "1000"
      Dashboard__RegistryUrl: ${DASHBOARD_REGISTRY_URL:-http://aspire-dashboard:18888/api/registry}
      Service__Name: app2
      Service__InternalUrl: http://app2:8080
      Service__PublicUrl: http://localhost:${APP2_PORT:-8082}
      Logging__LogLevel__Default: Information
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${APP2_PORT:-8082}:8080"
    depends_on:
      - app1
      - aspire-dashboard
    restart: unless-stopped

