map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    # Small health endpoint for the gateway itself.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # app2 API, exposed under a dedicated prefix so it cannot collide with the dashboard's own /api routes.
    location /app2/ {
        proxy_pass http://app2:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Custom control panel (the same page app2 serves at /).
    # It is served from the same origin as the Aspire Dashboard, so the iframe is allowed
    # by the dashboard's X-Frame-Options: SAMEORIGIN.
    location /control {
        proxy_pass http://app2:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets used only by the nginx UI patch (loaded on the dashboard origin).
    location = /dashboard-custom.js {
        root /etc/nginx/custom;
        add_header Content-Type application/javascript;
        add_header Cache-Control "no-store";
    }

    # Everything else is the official Aspire Dashboard UI (including Blazor websocket).
    location / {
        proxy_pass http://aspire-dashboard:18888;
        proxy_http_version 1.1;

        # Dashboard is a Blazor app; sub_filter needs an uncompressed response so we
        # can add a small stylesheet that hides demo-distracting banner/Help UI.
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</head>' '<style>.dashboard-message-bar.intent-warning,.dashboard-message-bar.intent-info,#dashboard-help-button{display:none!important}</style><script src="/dashboard-custom.js"></script></head>';

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
